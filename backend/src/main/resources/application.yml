server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: real-estate-management-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jpa:
    open-in-view: false

# JWT & CORS Configuration
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  seed:
    admin-password: ${SEED_ADMIN_PASSWORD:}
    manager-password: ${SEED_MANAGER_PASSWORD:}
    tenant-password: ${SEED_TENANT_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

---
# Default Local Profile: H2 Embedded Database
# Active by default when running locally with mvn spring-boot:run
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/realestatedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

---
# Production Profile: Supabase / PostgreSQL Database
# Activate via: SPRING_PROFILES_ACTIVE=postgres or mvn spring-boot:run "-Dspring-boot.run.profiles=postgres"
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
